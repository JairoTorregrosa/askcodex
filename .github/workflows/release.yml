name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Write scope is granted to the ONE job that publishes,
# and to nothing else: see the `release` job at the bottom. A job-level
# `permissions:` block replaces this map entirely rather than merging with it.
permissions:
  contents: read

jobs:
  build:
    # This job compiles ~180 third-party crates and executes their build
    # scripts. Anything that runs here must not be able to write to the
    # repository — a single compromised crate would otherwise hold a token that
    # can push commits, move tags, and rewrite releases.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # SUPPLY CHAIN: every `uses:` below is pinned to a full 40-character
      # commit SHA, with the version it corresponds to in a trailing comment.
      # A tag or a branch is mutable — whoever can move it runs code in this
      # job — so the comment is documentation and the SHA is the contract.
      # Each SHA was resolved from the upstream repository on 2026-08-08, not
      # recalled. To update one, resolve it again and never from memory:
      #   git ls-remote https://github.com/actions/checkout       refs/tags/v4.x.y
      #   git ls-remote https://github.com/Swatinem/rust-cache    refs/tags/v2.x.y
      # (take the peeled `^{}` line when the tag is annotated).
      #
      # dtolnay/rust-toolchain has no version tags: `stable` is a BRANCH, and
      # the action reads the toolchain to install from the REF NAME. Pinning it
      # freezes the action's code — which is the point — but the `toolchain:`
      # input below is then load-bearing, because the SHA no longer spells
      # "stable". Do not delete it. The compiler this project actually builds
      # with is governed by rust-toolchain.toml regardless.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-08
        with:
          # Restores what `@stable` used to say: this action reads its
          # toolchain from the REF NAME, so pinning the ref to a SHA without
          # this line would install whatever its default is.
          toolchain: stable
          targets: ${{ matrix.target }}
      # rust-toolchain.toml pins the channel and outranks the action above, so the
      # build runs on the pinned toolchain — which the action did not give this
      # target to. Install both explicitly: one of the two macOS legs is always a
      # cross-compile, and without this step it fails with "target may not be
      # installed". Both commands are non-zero on failure; nothing is skipped.
      - name: Add the release target to the pinned toolchain
        run: |
          set -eu
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        # `--locked` because Cargo.lock is committed: a release binary is built
        # from the exact dependency graph the maintainer reviewed and tagged,
        # not from whatever the registry resolves to on release day. Without it
        # a compromised — or merely updated — upstream crate enters a signed
        # release silently.
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          NAME="askcodex-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -czf "$NAME.tar.gz" -C "target/${{ matrix.target }}/release" askcodex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: askcodex-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    # The only job with write scope, and the only job that runs no third-party
    # code: it downloads the artifacts the build jobs produced, checksums them,
    # and calls `gh release create`. `contents: write` is what that last step
    # needs. Do not add a build, a test, or a `cargo` invocation to this job —
    # move it to `build`, which is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum askcodex-*.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            askcodex-*.tar.gz SHA256SUMS
